[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 needs Node 20.19+; pin it so older Netlify site defaults don't break the build.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# The app calls /api/<name>; Netlify serves functions at /.netlify/functions/<name>.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: send every other URL to index.html so refreshing /trips/… or /city/… works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
